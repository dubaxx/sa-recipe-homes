name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version matches tag
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src/info.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "info.json says $version, tag says $tag"
            exit 1
          fi

      - name: Locale keys
        run: python3 check-locale.py

      - name: Build
        id: build
        run: |
          set -euo pipefail
          echo "zip=$(./build.sh)" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --title "${GITHUB_REF_NAME#v}" --generate-notes

      - name: Mod portal
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          # The portal answers 200 with an error body, so check the payload rather than the status code.
          upload_url=$(curl -s -H "Authorization: Bearer $FACTORIO_API_KEY" \
            -F "mod=sa-recipe-homes" \
            https://mods.factorio.com/api/v2/mods/releases/init_upload |
            python3 -c "
          import json, sys
          body = json.load(sys.stdin)
          if 'error' in body:
              sys.exit(f\"init_upload failed: {body['error']}: {body.get('message', '')}\")
          print(body['upload_url'])
          ")
          curl -s -F "file=@${ZIP}" "$upload_url" | python3 -c "
          import json, sys
          body = json.load(sys.stdin)
          if 'error' in body:
              sys.exit(f\"upload failed: {body['error']}: {body.get('message', '')}\")
          print('published', body.get('url', ''))
          "
